<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX作品集</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }
        h1 {
            color: #00ECB2;
            text-align: center;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        h2 {
            color: #333;
        }
        .project {
            margin: 10px 0;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>UX作品集</h1>
    
    <div class="section">
        <h2>关于我</h2>
        <p>我是一名拥有12年+经验的UX设计师，专注于用户体验设计和产品设计。</p>
    </div>
    
    <div class="section">
        <h2>项目经验</h2>
        
        <div class="project">
            <h3>电商平台UI设计</h3>
            <p>负责电商平台的用户界面设计，包括首页、商品详情页、购物车等核心页面。</p>
        </div>
        
        <div class="project">
            <h3>移动应用设计</h3>
            <p>设计了一款健康追踪应用，包括用户界面和交互流程。</p>
        </div>
        
        <div class="project">
            <h3>企业管理系统</h3>
            <p>为企业设计了一套管理系统，提高了工作效率和用户体验。</p>
        </div>
    </div>
    
    <div class="section">
        <h2>技能</h2>
        <ul>
            <li>用户研究</li>
            <li>信息架构</li>
            <li>交互设计</li>
            <li>原型设计</li>
            <li>视觉设计</li>
        </ul>
    </div>
</body>
</html>
